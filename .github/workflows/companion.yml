# Reusable workflow for the companion repositories of my articles.
#
# Every push and pull request: validate.sh (bash -n, shellcheck, kubeconform).
# Push to the default branch, manual runs and the weekly schedule: the whole lab
# end to end in a kind cluster on the runner, with out/ kept as an artifact.
#
# Call it from .github/workflows/lab.yml in the companion repository:
#
#   jobs:
#     lab:
#       uses: filipemotta/companion-ci/.github/workflows/companion.yml@<commit sha>
#       with:
#         lab: bash scripts/test-all.sh
name: companion

on:
  workflow_call:
    inputs:
      validate:
        description: Run validate.sh from the repository root
        type: boolean
        default: true
      lab:
        description: Command that runs the whole lab and exits non-zero on failure ('' skips the lab)
        type: string
        default: bash scripts/test-all.sh
      teardown:
        description: Command that removes the lab, run even when the lab fails
        type: string
        default: bash scripts/teardown.sh
      lab-timeout-minutes:
        type: number
        default: 90
      kind-version:
        type: string
        default: v0.33.0
      kubeconform-version:
        type: string
        default: v0.8.0

permissions:
  contents: read

jobs:
  validate:
    if: inputs.validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1, pinned to the commit SHA of the tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: kubeconform ${{ inputs.kubeconform-version }} (checksum verified)
        env:
          VERSION: ${{ inputs.kubeconform-version }}
        run: |
          set -euo pipefail
          base="https://github.com/yannh/kubeconform/releases/download/${VERSION}"
          cd "${RUNNER_TEMP}"
          curl -sSfLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -sSfLO "${base}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf kubeconform-linux-amd64.tar.gz -C "${RUNNER_TEMP}/bin" kubeconform
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: validate.sh
        run: |
          set -euo pipefail
          shellcheck --version | head -2
          kubeconform -v
          if [ ! -f validate.sh ]; then echo "no validate.sh in the repository root"; exit 1; fi
          out="$(bash validate.sh 2>&1)" || { echo "${out}"; exit 1; }
          echo "${out}"
          # A missing validator is a failure in CI, not a skip.
          if grep -q '\[skipped\]' <<<"${out}"; then echo "validate.sh skipped a check"; exit 1; fi

  lab:
    if: >-
      inputs.lab != '' && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.lab-timeout-minutes }}
    concurrency:
      group: lab-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # actions/checkout v7.0.1, pinned to the commit SHA of the tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Free disk for node and mesh images
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: kind ${{ inputs.kind-version }} (checksum verified)
        env:
          VERSION: ${{ inputs.kind-version }}
        run: |
          set -euo pipefail
          base="https://github.com/kubernetes-sigs/kind/releases/download/${VERSION}"
          mkdir -p "${RUNNER_TEMP}/bin"
          cd "${RUNNER_TEMP}/bin"
          curl -sSfLo kind-linux-amd64 "${base}/kind-linux-amd64"
          curl -sSfL "${base}/kind-linux-amd64.sha256sum" | sha256sum -c -
          mv kind-linux-amd64 kind
          chmod +x kind
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Lab, end to end
        env:
          LAB: ${{ inputs.lab }}
        run: |
          kind version
          docker version --format 'docker {{.Server.Version}}'
          bash -c "${LAB}"
      - name: Keep out/ as an artifact
        if: always()
        # actions/upload-artifact v7.0.1, pinned to the commit SHA of the tag
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lab-out
          path: out/
          if-no-files-found: ignore
          retention-days: 14
      - name: Teardown
        if: always() && inputs.teardown != ''
        env:
          TEARDOWN: ${{ inputs.teardown }}
        run: bash -c "${TEARDOWN}" || true
